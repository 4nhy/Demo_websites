<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estates — StayLux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="line-tex"></div>

<nav class="glass" id="navbar">
  <a href="index.html" class="logo" style="text-decoration:none;">Stay<span>Lux</span></a>
  <div class="navlinks">
    <a href="estates.html" class="active">Estates</a>
    <a href="amenities.html">Amenities</a>
    <a href="concierge.html">Concierge</a>
  </div>
  <button class="cta magnetic" onclick="openModal('signInModal')">Sign In</button>
</nav>

<section class="page-hero">
  <div class="page-hero-bg" id="pageHeroBg" style="background-image:url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=2200&q=90')"></div>
  <div class="hero-vignette"></div>
  <div class="page-hero-content"><div class="tag">VERIFIED RESIDENCES</div><h1>Every estate, searchable.</h1></div>
</section>

<section class="body">
  <div class="section-inner">
    <div class="glass filter-bar">
      <input type="text" id="searchInput" placeholder="Search by name or location..." oninput="renderEstates()">
      <select id="typeFilter" onchange="renderEstates()">
        <option value="all">All Types</option>
        <option value="villa">Villa</option>
        <option value="penthouse">Penthouse</option>
        <option value="chalet">Chalet</option>
        <option value="island">Island</option>
      </select>
      <select id="sortFilter" onchange="renderEstates()">
        <option value="default">Sort: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<footer>
  <a href="index.html" class="logo" style="text-decoration:none;">Stay<span style="color:var(--brass);">Lux</span></a>
  <p>© 2026 StayLux Private Estates. All rights reserved.</p>
</footer>

<div class="modal-backdrop" id="signInModal">
  <div class="glass modal-box">
    <button class="modal-close" onclick="closeModal('signInModal')">✕</button>
    <h3>Welcome back</h3><p class="sub">Sign in to manage your reservations.</p>
    <form id="signInForm">
      <div class="form-row"><label>Email</label><input type="email" required placeholder="you@email.com"></div>
      <div class="form-row"><label>Password</label><input type="password" required placeholder="••••••••"></div>
      <button type="submit" class="submit-btn magnetic" style="width:100%;">Sign In</button>
    </form>
    <div class="confirm-msg" id="signInMsg">Signed in successfully.</div>
  </div>
</div>

<script>
const estates = [
  {title:"Aetheria Villa", type:"villa", loc:"Santorini, Greece", price:1250, img:"https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=800&q=80"},
  {title:"Komorebi Estate", type:"villa", loc:"Kyoto, Japan", price:1400, img:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80"},
  {title:"Skyline Suite", type:"penthouse", loc:"Tokyo, Japan", price:880, img:"images/hero-villa-night.jpg"},
  {title:"Manhattan Sky Loft", type:"penthouse", loc:"New York, USA", price:1750, img:"images/hero-villa-night.jpg"},
  {title:"Nordic Pine Chalet", type:"chalet", loc:"Zermatt, Switzerland", price:980, img:"https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=800&q=80"},
  {title:"Aspen High-Ridge Lodge", type:"chalet", loc:"Aspen, Colorado", price:1600, img:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=800&q=80"},
  {title:"Azure Ocean Suite", type:"island", loc:"Baa Atoll, Maldives", price:2100, img:"https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=800&q=80"},
  {title:"Amalfi Cliffside", type:"island", loc:"Amalfi Coast, Italy", price:1950, img:"https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80"}
];
function renderEstates(){
  const q = document.getElementById("searchInput").value.toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const sort = document.getElementById("sortFilter").value;
  let filtered = estates.filter(e => (e.title.toLowerCase().includes(q) || e.loc.toLowerCase().includes(q)) && (type === "all" || e.type === type));
  if(sort === "low") filtered.sort((a,b)=>a.price-b.price);
  if(sort === "high") filtered.sort((a,b)=>b.price-a.price);
  document.getElementById("grid").innerHTML = filtered.length ? filtered.map(s => `
    <div class="glass card visible" onclick="openModal('d-${s.title.replace(/\s/g,'')}')">
      <div class="img-wrap"><img src="${s.img}" alt="${s.title}"></div>
      <span class="chip chip-float">${s.type}</span>
      <div class="card-info"><div class="loc">${s.loc}</div><h3>${s.title}</h3><div class="price">$${s.price.toLocaleString()} <span>/ night</span></div></div>
    </div>
    <div class="modal-backdrop" id="d-${s.title.replace(/\s/g,'')}">
      <div class="glass modal-box">
        <button class="modal-close" onclick="closeModal('d-${s.title.replace(/\s/g,'')}')">✕</button>
        <h3>${s.title}</h3><p class="sub">${s.loc} · $${s.price.toLocaleString()} / night</p>
        <a href="concierge.html" class="submit-btn magnetic" style="display:inline-block;text-decoration:none;">Request Reservation</a>
      </div>
    </div>`).join('') : `<p style="color:var(--muted);grid-column:1/-1;">No estates match your search.</p>`;
}
(function(){
  const params = new URLSearchParams(window.location.search);
  const t = params.get("type");
  if(t){ document.getElementById("typeFilter").value = t; }
})();
renderEstates();
</script>
<script src="common.js"></script>
</body>
</html>
